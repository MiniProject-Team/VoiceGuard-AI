dataset:
  raw_dir: data/raw
  processed_dir: data/processed
  metadata_dir: data/metadata
  reports_dir: reports
audio:
  sample_rate: 16000
  channels: 1
  normalize: true
validation:
  minimum_duration_seconds: 0.1
  supported_sample_rates: [8000, 11025, 16000, 22050, 24000, 32000, 44100, 48000, 96000]
  silence_threshold: 0.0001
  silent_fraction_warning: 0.99
  low_peak_warning: 0.001
  warn_multiple_channels: true
segmentation:
  duration_seconds: 5.0
  hop_seconds: 2.5
  short_audio_policy: pad
split:
  train: 0.70
  validation: 0.15
  test: 0.15
  random_seed: 42
augmentation:
  enabled: false
  noise_probability: 0.2
  gain_probability: 0.2
  speed_probability: 0.1
  pitch_probability: 0.1
  telephone_probability: 0.1
